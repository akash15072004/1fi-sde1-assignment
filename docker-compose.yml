services:
  db:
    image: postgres:16-alpine
    container_name: onefi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onefi_emi
    ports:
      - "5433:5432"
    volumes:
      - onefi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onefi_emi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onefi_postgres_data: